{
    'schema_version': 1,
    'name': 'oh-my-zsh',
    'requires': ['zsh'],
    'actions': [
        {'installer': {
            'url': 'https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh',
            'args': ['--unattended', '--keep-zshrc'],
            'env': {'ZSH': '', 'ZDOTDIR': ''},
            'check': {'file_exists': '~/.oh-my-zsh/oh-my-zsh.sh'},
        }},
        {'link': {
            '~/.oh-my-zsh/custom/powerlevel9k.settings.zsh': 'files/custom/powerlevel9k.settings.zsh',
            '~/.oh-my-zsh/custom/plugins/zsh-autosuggestions': 'files/custom/plugins/zsh-autosuggestions',
            '~/.oh-my-zsh/custom/plugins/zsh-completions': 'files/custom/plugins/zsh-completions',
            '~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting': 'files/custom/plugins/zsh-syntax-highlighting',
            '~/.oh-my-zsh/custom/themes/powerlevel9k': 'files/custom/themes/powerlevel9k',
            '~/.oh-my-zsh/custom/themes/powerlevel10k': 'files/custom/themes/powerlevel10k',
        }},
    ],
}
