{
    'schema_version': 1,
    'name': 'vscode',
    'actions': [
        {
            'brew': {'casks': ['visual-studio-code']},
            'when': {'os': 'macos', 'command': 'brew'},
            'requires': ['homebrew'],
        },
        {
            'link': {
                '~/Library/Application Support/Code/User/settings.json': 'files/settings.json',
                '~/Library/Application Support/Code/User/keybindings.json': 'files/keybindings.json',
            },
            'when': {'os': 'macos'},
        },
        {
            'link': {
                '~/.config/Code/User/settings.json': 'files/settings.json',
                '~/.config/Code/User/keybindings.json': 'files/keybindings.json',
            },
            'when': {'os': 'linux'},
        },
        {
            'vscode': {'extensions': [
                'editorconfig.editorconfig',
                'oxc.oxc-vscode',
                'astro-build.astro-vscode',
                'bradlc.vscode-tailwindcss',
                'streetsidesoftware.code-spell-checker',
                'usernamehw.errorlens',
                'Catppuccin.catppuccin-vsc',
                'Catppuccin.catppuccin-vsc-icons',
                'eamodio.gitlens',
                'DavidAnson.vscode-markdownlint',
                'yzhang.markdown-all-in-one',
                'ms-vscode-remote.vscode-remote-extensionpack',
                'ms-azuretools.vscode-containers',
                'ms-vscode.cpptools',
                'rust-lang.rust-analyzer',
                'ms-python.python',
                'golang.go',
                'redhat.vscode-yaml',
            ]},
            'when': {'command': 'code'},
        },
    ],
}
