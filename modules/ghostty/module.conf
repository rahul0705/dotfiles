{
    'schema_version': 1,
    'name': 'ghostty',
    'when': {'os': 'macos'},
    'actions': [
        {
            'brew': {'casks': ['ghostty']},
            'when': {'command': 'brew'},
            'requires': ['homebrew'],
        },
        {'link': {
            '~/.config/ghostty/config': 'files/config',
            '~/.config/ghostty/themes/catppuccin-frappe.conf': 'files/themes/catppuccin/themes/catppuccin-frappe.conf',
            '~/.config/ghostty/themes/catppuccin-latte.conf': 'files/themes/catppuccin/themes/catppuccin-latte.conf',
            '~/.config/ghostty/themes/catppuccin-macchiato.conf': 'files/themes/catppuccin/themes/catppuccin-macchiato.conf',
            '~/.config/ghostty/themes/catppuccin-mocha.conf': 'files/themes/catppuccin/themes/catppuccin-mocha.conf',
        }},
    ],
}
