# Select with: codex --profile dotfiles
personality = "pragmatic"

[mcp_servers.serena]
command = "sh"
args = ["-c", 'PATH="$HOME/.local/bin:$PATH" exec uvx --from "$HOME/.local/share/codex/serena" serena start-mcp-server --project-from-cwd --context codex --open-web-dashboard False']
startup_timeout_sec = 180

[mcp_servers.codebase-memory]
command = "sh"
args = ["-c", 'exec "$HOME/.local/bin/codebase-memory-mcp"']
startup_timeout_sec = 180
