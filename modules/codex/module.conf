{
  'schema_version': 1,
  'name': 'codex',
  'actions': [
    {
      'link': {
        '~/.codex/AGENTS.md': 'files/AGENTS.md',
      },
    },
    {
      'link': {
        '~/.codex/dotfiles.config.toml': 'files/dotfiles.config.toml',
      },
      'when': {
        'os': 'macos',
      },
    },
    {
      'codex': {
        'marketplaces': ['DietrichGebert/ponytail', 'JuliusBrussee/caveman', 'mattpocock/skills'],
        'plugins': ['ponytail@ponytail', 'caveman@caveman', 'mattpocock-skills@mattpocock'],
      },
      'when': {
        'os': 'macos',
        'command': 'codex',
      },
    },
    {
      'brew': {
        'formulae': ['uv', 'rtk'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'shell': {
        'command': 'uv tool install -p 3.13 serena-agent',
        'check': {
          'file_exists': '~/.local/bin/serena',
        },
        'timeout': 600,
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'shell': {
        'command': 'uv tool install codebase-memory-mcp',
        'check': {
          'file_exists': '~/.local/bin/codebase-memory-mcp',
        },
        'timeout': 600,
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
  ],
}
