{
  'schema_version': 1,
  'name': 'codex',
  'actions': [
    {
      'link': {
        '~/.codex/AGENTS.md': 'files/AGENTS.md',
      },
    },
    {
      'link': {
        '~/.codex/dotfiles.config.toml': 'files/dotfiles.config.toml',
        '~/.agents/skills/ponytail': 'files/upstream/ponytail/skills/ponytail',
        '~/.agents/skills/caveman': 'files/upstream/caveman/skills/caveman',
      },
      'when': {
        'os': 'macos',
      },
    },
    {
      'brew': {
        'formulae': ['uv', 'rtk'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'shell': {
        'command': 'uv tool install -p 3.13 serena-agent',
        'check': {
          'file_exists': '~/.local/bin/serena',
        },
        'timeout': 600,
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'shell': {
        'command': 'uv tool install codebase-memory-mcp',
        'check': {
          'file_exists': '~/.local/bin/codebase-memory-mcp',
        },
        'timeout': 600,
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
  ],
}
