{
  'schema_version': 1,
  'name': 'codex',
  'actions': [
    {
      'link': {
        '~/.codex/AGENTS.md': 'files/AGENTS.md',
      },
    },
    {
      'link': {
        '~/.codex/dotfiles.config.toml': 'files/dotfiles.config.toml',
        '~/.agents/skills/ponytail': 'files/upstream/ponytail/skills/ponytail',
        '~/.agents/skills/caveman': 'files/upstream/caveman/skills/caveman',
        '~/.local/share/codex/serena': 'files/upstream/serena',
      },
      'when': {
        'os': 'macos',
      },
    },
    {
      'brew': {
        'formulae': ['uv'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'installer': {
        'url': 'https://raw.githubusercontent.com/rtk-ai/rtk/e001f773f80b22b7dc4c7a79521b30e35aaef026/install.sh',
        'sha256': 'd6eb73a772903e13ff34ee1be8a8b24e896ba9a978f20d2279a08b4083ea6f77',
        'shell': '/bin/sh',
        'check': {
          'file_exists': '~/.local/bin/rtk',
        },
        'env': {
          'RTK_VERSION': 'v0.51.0',
        },
      },
      'when': {
        'os': 'macos',
      },
    },
    {
      'shell': {
        'command': 'uv tool install codebase-memory-mcp==0.11.0',
        'check': {
          'file_exists': '~/.local/bin/codebase-memory-mcp',
        },
        'timeout': 600,
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
  ],
}
