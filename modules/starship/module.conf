{
    'schema_version': 1,
    'name': 'starship',
    'facts': {
        'version': {'version': {'command': ['starship', '--version']}},
    },
    'actions': [
        {
            'installer': {
                'url': 'https://starship.rs/install.sh',
                'args': ['--yes'],
                'check': {'file_exists': '/usr/local/bin/starship'},
            },
            'when': {'os': 'linux'},
            'refresh': ['version'],
        },
        {
            'brew': {'formulae': ['starship']},
            'when': {'os': 'macos', 'command': 'brew'},
            'requires': ['homebrew'],
            'refresh': ['version'],
        },
        {
            'link': {'~/.config/starship.toml': 'files/starship.toml'},
            'when': {'command': 'starship', 'fact': {'name': 'version', 'matches': '>=1.0'}},
        },
    ],
}
