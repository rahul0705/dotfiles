{
    'schema_version': 1,
    'name': 'starship',
    'facts': {
        'linux_version': {'version': {'command': ['/usr/local/bin/starship', '--version']}},
        'mac_version': {'version': {'command': ['starship', '--version']}},
    },
    'actions': [
        {
            'installer': {
                'url': 'https://starship.rs/install.sh',
                'args': ['--yes'],
                'check': {'file_exists': '/usr/local/bin/starship'},
            },
            'when': {'os': 'linux'},
            'refresh': ['linux_version'],
        },
        {
            'brew': {'formulae': ['starship']},
            'when': {'os': 'macos'},
            'refresh': ['mac_version'],
        },
        {
            'link': {'~/.config/starship.toml': 'files/starship.toml'},
            'when': {'os': 'linux', 'fact': {'name': 'linux_version', 'matches': '>=1.0'}},
        },
        {
            'link': {'~/.config/starship.toml': 'files/starship.toml'},
            'when': {'os': 'macos', 'fact': {'name': 'mac_version', 'matches': '>=1.0'}},
        },
    ],
}
