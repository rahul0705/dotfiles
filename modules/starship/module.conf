{
  'schema_version': 1,
  'name': 'starship',
  'actions': [
    {
      'installer': {
        'url': 'https://starship.rs/install.sh',
        'args': ['--yes'],
        'check': {
          'file_exists': '/usr/local/bin/starship',
        },
      },
      'when': {
        'os': 'linux',
      },
    },
    {
      'brew': {
        'formulae': ['starship'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'winget': {
        'packages': ['Starship.Starship'],
      },
      'when': {
        'os': 'windows',
      },
    },
    {
      'link': {
        '~/.config/starship.toml': 'files/starship.toml',
      },
    },
  ],
}
