{
    'schema_version': 1,
    'name': 'starship',
    'facts': {
        'linux_version': {'version': {'command': ['~/.local/bin/starship', '--version']}},
        'mac_version': {'version': {'command': ['starship', '--version']}},
    },
    'actions': [
        {
            'installer': {
                'url': 'https://raw.githubusercontent.com/starship/starship/v1.26.0/install/install.sh',
                'sha256': '52c64f14a558034ebeb1907ea9364e802b32474576fd3e68265f73bc33cc8fbb',
                'shell': './scripts/install-starship.sh',
                'args': ['--yes', '--version', 'v1.26.0'],
                'check': {'file_exists': '~/.local/bin/starship'},
            },
            'when': {'os': 'linux'},
            'refresh': ['linux_version'],
        },
        {
            'brew': {'formulae': ['starship']},
            'when': {'os': 'macos'},
            'refresh': ['mac_version'],
        },
        {
            'link': {'~/.config/starship.toml': 'files/starship.toml'},
            'when': {'os': 'linux', 'fact': {'name': 'linux_version', 'matches': '>=1.0'}},
        },
        {
            'link': {'~/.config/starship.toml': 'files/starship.toml'},
            'when': {'os': 'macos', 'fact': {'name': 'mac_version', 'matches': '>=1.0'}},
        },
    ],
}
