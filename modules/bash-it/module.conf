{
    'schema_version': 1,
    'name': 'bash-it',
    'actions': [
        {
            'shell': {
                'command': 'git clone --depth=1 https://github.com/Bash-it/bash-it.git "$HOME/.bash-it" && "$HOME/.bash-it/install.sh" --silent --no-modify-config',
                'check': {'file_exists': '~/.bash-it/bash_it.sh'},
            },
        },
        {
            'link': {
                '~/.bash-it/custom/base16-shell.plugin.bash': 'files/base16-shell.plugin.bash',
                '~/.bash-it/custom/base16-shell.settings.bash': 'files/base16-shell.settings.bash',
                '~/.bash-it/custom/plugins/base16-shell': 'files/plugins/base16-shell',
            },
        },
    ],
}
