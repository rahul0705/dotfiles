{
  'schema_version': 1,
  'name': 'oh-my-bash',
  'requires': ['bash'],
  'actions': [
    {
      'shell': {
        # Upstream's default installer replaces .bashrc and has no keep-bashrc flag.
        # A clone installs the framework at its default path without touching our rc files.
        'command': 'git clone --depth=1 https://github.com/ohmybash/oh-my-bash.git "$HOME/.oh-my-bash"',
        'check': {
          'file_exists': '~/.oh-my-bash/oh-my-bash.sh',
        },
      },
    },
  ],
}
