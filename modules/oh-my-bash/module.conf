{
  'schema_version': 1,
  'name': 'oh-my-bash',
  'requires': ['bash'],
  'actions': [
    {
      'installer': {
        'url': 'https://raw.githubusercontent.com/ohmybash/oh-my-bash/master/tools/install.sh',
        'shell': 'bash',
        'args': ['--unattended', '--prefix', '~/.local'],
        'expand_home': True,
        'check': {
          'file_exists': '~/.local/share/oh-my-bash/oh-my-bash.sh',
        },
      },
    },
  ],
}
