{
    'schema_version': 1,
    'name': 'fonts',
    'actions': [
        {
            'installer': {
                'url': 'https://raw.githubusercontent.com/ryanoasis/nerd-fonts/master/install.sh',
                'shell': '/bin/bash',
                'args': ['install', 'Hack'],
                'check': {'file_exists': '~/.local/share/fonts/NerdFonts/HackNerdFont-Regular.ttf'},
            },
            'when': {'os': 'linux'},
        },
        {
            'installer': {
                'url': 'https://raw.githubusercontent.com/ryanoasis/nerd-fonts/master/install.sh',
                'shell': '/bin/bash',
                'args': ['install', 'FiraCode'],
                'check': {'file_exists': '~/.local/share/fonts/NerdFonts/FiraCodeNerdFont-Regular.ttf'},
            },
            'when': {'os': 'linux'},
        },
        {
            'brew': {'casks': ['font-hack-nerd-font', 'font-fira-code-nerd-font']},
            'when': {'os': 'macos', 'command': 'brew'},
            'requires': ['homebrew'],
        },
    ],
}
