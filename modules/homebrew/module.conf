{
    'schema_version': 1,
    'name': 'homebrew',
    'when': {'os': 'macos'},
    'actions': [
        {'shell': {
            'command': 'sudo -v',
            'stdin': True,
            'check': {'command': 'brew'},
        }},
        {'installer': {
            'url': 'https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh',
            'shell': '/bin/bash',
            'env': {'NONINTERACTIVE': '1'},
            'check': {'command': 'brew'},
        }},
    ],
}
