{
    'schema_version': 1,
    'name': 'homebrew',
    'when': {'os': 'macos'},
    'actions': [
        {'installer': {
            'url': 'https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh',
            'shell': '/bin/bash',
            'stdin': True,
            'timeout': 1800,
        }, 'when': {'not': {'command': ['brew', '/opt/homebrew/bin/brew', '/usr/local/bin/brew']}}},
    ],
}
