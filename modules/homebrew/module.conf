{
    'schema_version': 1,
    'name': 'homebrew',
    'when': {'os': 'macos'},
    'actions': [
        {'shell': {
            'command': ['/usr/bin/true'],
            'description': 'Authorize Homebrew installer sudo access',
            'sudo': True,
            'stdin': True,
        }, 'when': {'not': {'command': ['brew', '/opt/homebrew/bin/brew', '/usr/local/bin/brew']}}},
        {'installer': {
            'url': 'https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh',
            'shell': '/bin/bash',
            'env': {'NONINTERACTIVE': '1'},
            'timeout': 1800,
        }, 'when': {'not': {'command': ['brew', '/opt/homebrew/bin/brew', '/usr/local/bin/brew']}}},
    ],
}
