{
  'schema_version': 1,
  'name': 'finder',
  'when': {
    'os': 'macos',
  },
  'actions': [
    {
      'macos_defaults': {
        'domain': 'NSGlobalDomain',
        'values': {
          'AppleShowAllExtensions': True,
        },
      },
    },
    {
      'macos_defaults': {
        'domain': 'com.apple.finder',
        'values': {
          'ShowPathbar': True,
          'ShowStatusBar': True,
          'AppleShowAllFiles': False,
        },
      },
    },
    {
      'macos_defaults': {
        'domain': 'com.apple.desktopservices',
        'values': {
          'DSDontWriteNetworkStores': True,
          'DSDontWriteUSBStores': True,
        },
      },
    },
  ],
}
