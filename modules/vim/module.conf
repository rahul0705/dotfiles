{
    'schema_version': 1,
    'name': 'vim',
    'actions': [
        {'link': {
            '~/.vim': 'files',
            '~/.vimrc': 'files/vimrc',
        }},
        {'shell': {
            'command': 'curl -fL --remove-on-error -o "$HOME/.local/share/vim/site/autoload/plug.vim" --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim',
            'check': {'file_exists': '~/.local/share/vim/site/autoload/plug.vim'},
        }},
        {'script': {
            'path': 'install-plugins.sh',
            'check': {'file_exists': '~/.local/share/vim/plugged/.etch-initialized'},
            'timeout': 1200,
        }},
    ],
}
