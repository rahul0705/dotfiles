{
  'schema_version': 1,
  'name': 'powershell',
  'when': {
    'os': 'windows',
  },
  'actions': [
    {
      'link': {
        '~/.config/powershell/profile.ps1': 'files/profile.ps1',
      },
    },
    {
      'script': {
        'path': 'install-profiles.ps1',
        'check': {
          'file_exists': '~/.local/state/powershell/profiles-installed',
        },
      },
    },
  ],
}
