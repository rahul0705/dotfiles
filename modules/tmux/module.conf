{
    'schema_version': 1,
    'name': 'tmux',
    'facts': {'version': {'version': {'command': ['tmux', '-V']}}},
    'actions': [
        {'link': {'~/.tmux': 'files'}},
        {
            'link': {'~/.tmux.conf': 'files/tmux.conf'},
            'when': {'fact': {'name': 'version', 'matches': '>=2.1'}},
        },
        {
            'link': {'~/.tmux.conf': 'files/tmux-legacy.conf'},
            'when': {'fact': {'name': 'version', 'matches': '<2.1'}},
        },
    ],
}
