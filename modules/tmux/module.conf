{
  'schema_version': 1,
  'name': 'tmux',
  'facts': {
    'version': {
      'provider': 'version',
      'command': ['tmux', '-V'],
    },
  },
  'actions': [
    {
      'brew': {
        'formulae': ['tmux'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
      'refresh': ['version'],
    },
    {
      'link': {
        '~/.tmux': 'files',
      },
    },
    {
      'link': {
        '~/.tmux.conf': 'files/tmux.conf',
      },
      'when': {
        'command': ['tmux', 'brew'],
        'fact': {
          'name': 'version',
          'matches': '>=2.1',
        },
      },
    },
    {
      'link': {
        '~/.tmux.conf': 'files/tmux-legacy.conf',
      },
      'when': {
        'command': ['tmux', 'brew'],
        'fact': {
          'name': 'version',
          'matches': '<2.1',
        },
      },
    },
    {
      'shell': {
        'command': '"$HOME/.tmux/plugins/tpm/bin/install_plugins"',
        'check': {
          'directory_exists': '~/.tmux/plugins/tmux-continuum',
        },
        'timeout': 1200,
      },
      'when': {
        'command': 'tmux',
      },
    },
  ],
}
