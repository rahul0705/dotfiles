{
    'schema_version': 1,
    'name': 'zsh',
    'requires': ['starship'],
    'actions': [
        {'shell': {
            'command': 'git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"',
            'check': {'file_exists': '~/.oh-my-zsh/oh-my-zsh.sh'},
        }},
        {'link': {
            '~/.oh-my-zsh/custom/powerlevel9k.settings.zsh': 'files/oh-my-zsh/custom/powerlevel9k.settings.zsh',
            '~/.oh-my-zsh/custom/plugins/zsh-autosuggestions': 'files/oh-my-zsh/custom/plugins/zsh-autosuggestions',
            '~/.oh-my-zsh/custom/plugins/zsh-completions': 'files/oh-my-zsh/custom/plugins/zsh-completions',
            '~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting': 'files/oh-my-zsh/custom/plugins/zsh-syntax-highlighting',
            '~/.oh-my-zsh/custom/themes/powerlevel9k': 'files/oh-my-zsh/custom/themes/powerlevel9k',
            '~/.oh-my-zsh/custom/themes/powerlevel10k': 'files/oh-my-zsh/custom/themes/powerlevel10k',
        }},
        {'link': {
            '~/.zprofile': 'files/zprofile',
            '~/.zshrc': 'files/zshrc',
        }},
    ],
}
