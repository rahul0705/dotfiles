{
  'schema_version': 1,
  'name': 'bash',
  'requires': ['shell-common'],
  'actions': [
    {
      'brew': {
        'formulae': ['bash-completion@2'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'link': {
        '~/.bashrc': 'files/bashrc',
        '~/.bash_profile': 'files/bash_profile',
      },
    },
  ],
}
