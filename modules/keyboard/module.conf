{
  'schema_version': 1,
  'name': 'keyboard',
  'when': {
    'os': 'macos',
  },
  'actions': [
    {
      'macos_defaults': {
        'domain': 'NSGlobalDomain',
        'values': {
          'NSAutomaticCapitalizationEnabled': True,
