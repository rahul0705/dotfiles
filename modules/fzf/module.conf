{
  'schema_version': 1,
  'name': 'fzf',
  'actions': [
    {
      'brew': {
        'formulae': ['fzf'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'shell': {
        'command': 'set -eu\n# Release archives include the version in their name; update this when upgrading fzf.\nversion=0.74.5\ncase "$(uname -m)" in\n    x86_64) arch=amd64 ;;\n    aarch64|arm64) arch=arm64 ;;\n    *) printf \'No configured fzf binary for this architecture\\n\' >&2; exit 1 ;;\nesac\nif [ -e "$HOME/.local/bin/fzf" ] || [ -L "$HOME/.local/bin/fzf" ]; then\n    printf \'Refusing to replace conflicting ~/.local/bin/fzf\\n\' >&2\n    exit 1\nfi\nwork_dir=$(mktemp -d)\ntrap \'rm -rf "$work_dir"\' EXIT\ncurl -fsSL "https://github.com/junegunn/fzf/releases/download/v$version/fzf-$version-linux_$arch.tar.gz" -o "$work_dir/fzf.tar.gz"\ntar -xzf "$work_dir/fzf.tar.gz" -C "$work_dir" fzf\nmkdir -p "$HOME/.local/bin"\ninstall -m 755 "$work_dir/fzf" "$HOME/.local/bin/fzf"\n',
        'check': {
          'file_exists': '~/.local/bin/fzf',
        },
      },
      'when': {
        'os': 'linux',
        'not': {
          'command': 'fzf',
        },
      },
    },
    {
      'link': {
        '~/.config/shell/fzf.sh': 'files/init.sh',
      },
    },
  ],
}
