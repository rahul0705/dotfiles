{
  'schema_version': 1,
  'name': 'fzf',
  'actions': [
    {
      'brew': {
        'formulae': ['fzf'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'shell': {
        'command': 'umask g-w,o-w && mkdir -p "$HOME/.local/share" && git clone --depth=1 https://github.com/junegunn/fzf.git "$HOME/.local/share/fzf"',
        'check': {
          'file_exists': '~/.local/share/fzf/install',
        },
      },
      'when': {
        'os': 'linux',
        'not': {
          'command': 'fzf',
        },
      },
    },
    {
      'shell': {
        # Upstream needs its checkout directory; --bin leaves shell startup files untouched.
        'command': '"$HOME/.local/share/fzf/install" --bin',
        'check': {
          'file_exists': '~/.local/share/fzf/bin/fzf',
        },
      },
      'when': {
        'os': 'linux',
        'not': {
          'command': 'fzf',
        },
      },
    },
    {
      'shell': {
        # Fail rather than overwrite a conflicting destination; valid existing files are preserved.
        'command': 'mkdir -p "$HOME/.local/bin" && ln -s "$HOME/.local/share/fzf/bin/fzf" "$HOME/.local/bin/fzf"',
        'check': {
          'file_exists': '~/.local/bin/fzf',
        },
      },
      'when': {
        'os': 'linux',
        'not': {
          'command': 'fzf',
        },
      },
    },
    {
      'link': {
        '~/.config/shell/fzf.sh': 'files/init.sh',
      },
    },
  ],
}
