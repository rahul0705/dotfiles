{
  'schema_version': 1,
  'name': 'fzf',
  'actions': [
    {
      'brew': {
        'formulae': ['fzf'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'script': {
        'path': 'install-fzf.sh',
      },
      'when': {
        'os': 'linux',
      },
    },
    {
      'link': {
        '~/.config/shell/fzf.sh': 'files/init.sh',
      },
    },
  ],
}
