{
  'schema_version': 1,
  'name': 'fzf',
  'when': {
    'not': {
      'os': 'windows',
    },
  },
  'actions': [
    {
      'brew': {
        'formulae': ['fzf'],
      },
      'when': {
        'os': 'macos',
        'command': 'brew',
      },
      'requires': ['homebrew'],
    },
    {
      'script': {
        'path': 'install-fzf.sh',
        'check': {
          'file_exists': '~/.local/bin/fzf',
        },
      },
      'when': {
        'os': 'linux',
        'not': {
          'command': 'fzf',
        },
      },
    },
    {
      'link': {
        '~/.config/shell/fzf.sh': 'files/init.sh',
      },
    },
  ],
}
