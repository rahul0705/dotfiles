name: Etch migration

on:
  push:
    branches: [dev, 'codex/**']
    paths: ['etch', 'defaults.conf', 'modules/**', 'profiles/**', 'vendor/etch', '.gitmodules', '.github/workflows/etch.yml']
  pull_request:
    paths: ['etch', 'defaults.conf', 'modules/**', 'profiles/**', 'vendor/etch', '.gitmodules', '.github/workflows/etch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-migration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize the pinned engine and reference plugins
        run: git submodule update --init vendor/etch
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install and inspect the Git profile
        shell: bash
        env:
          HOME: ${{ runner.temp }}/etch-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          uname -sm
          python3 --version
          git --version
          ./etch
          ./etch plan --profile developer -v
          ./etch doctor --profile developer
          test -z "$(find "$HOME" -mindepth 1 -print -quit)"

          ./etch apply --profile developer
          for name in gitconfig gitignore_global gitmessage; do
            test -L "$HOME/.$name"
            test "$(readlink "$HOME/.$name")" = "$GITHUB_WORKSPACE/modules/git/files/$name"
            test "$(readlink "tools/vcs/git")" = "../../modules/git/files"
          done
          test "$(git config --file "$HOME/.gitconfig" --get core.editor)" = vim

          ./etch apply --profile developer | tee "$RUNNER_TEMP/etch-second-apply.log"
          if grep -Eq '^(CHANGED|FAILED|BLOCKED) ' "$RUNNER_TEMP/etch-second-apply.log"; then
            echo 'Second Etch apply changed state or failed.' >&2
            exit 1
          fi
          ./etch doctor --profile developer
