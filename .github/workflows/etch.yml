name: Etch compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Initialize Etch and module assets
        run: git submodule update --init --recursive vendor/etch modules
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Etch configures these tools but does not install them on Linux.
          sudo apt-get update -qq
          sudo apt-get install -y tmux vim zsh
          # Linux VS Code installation is user-managed; make extension installation observable.
          curl -fsSL https://update.code.visualstudio.com/latest/linux-deb-x64/stable -o "$RUNNER_TEMP/code.deb"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$RUNNER_TEMP/code.deb"
      - name: Apply developer profile
        shell: bash
        env:
          HOME: ${{ runner.temp }}/etch-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export HOMEBREW_CASK_OPTS="--appdir=$RUNNER_TEMP/etch-apps"
            mkdir -p "$RUNNER_TEMP/etch-apps"
          fi
          ./etch validate
          ./etch plan --profile developer
          if [[ "$RUNNER_OS" == macOS ]] && ! command -v brew >/dev/null; then
            ./etch apply --profile developer --allow-sudo
            case "$(uname -m)" in
              arm64) brew_bin=/opt/homebrew/bin/brew ;;
              *) brew_bin=/usr/local/bin/brew ;;
            esac
            eval "$("$brew_bin" shellenv)"
          fi
          ./etch apply --profile developer
