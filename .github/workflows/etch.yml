name: Etch migration

on:
  push:
    branches: [dev, 'codex/**']
    paths: ['etch', 'defaults.conf', 'modules/**', 'profiles/**', 'vendor/etch', '.gitmodules', '.github/workflows/etch.yml']
  pull_request:
    paths: ['etch', 'defaults.conf', 'modules/**', 'profiles/**', 'vendor/etch', '.gitmodules', '.github/workflows/etch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-migration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize the pinned engine and shell plugins
        run: git submodule update --init --recursive vendor/etch modules/tmux/files/plugins/tpm modules/oh-my-zsh/files/custom/plugins/zsh-autosuggestions modules/oh-my-zsh/files/custom/plugins/zsh-completions modules/oh-my-zsh/files/custom/plugins/zsh-syntax-highlighting modules/oh-my-zsh/files/custom/themes/powerlevel9k modules/oh-my-zsh/files/custom/themes/powerlevel10k
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Make tmux available for version inspection
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            if [[ "$RUNNER_OS" == macOS ]]; then
              brew install tmux
            else
              sudo apt-get update -qq
              sudo apt-get install -y tmux
            fi
          fi
          tmux -V
      - name: Make zsh available for startup inspection
        shell: bash
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zsh
          fi
          zsh --version
      - name: Install and inspect the developer profile
        shell: bash
        env:
          HOME: ${{ runner.temp }}/etch-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          uname -sm
          python3 --version
          git --version
          ./etch
          ./etch plan --profile developer -v | tee "$RUNNER_TEMP/etch-first-plan.log"
          ./etch doctor --profile developer
          test ! -e "$HOME/.gitconfig"
          test ! -e "$HOME/.tmux"
          test ! -e "$HOME/.tmux.conf"
          test ! -e "$HOME/.config/starship.toml"
          test ! -e "$HOME/.local/share/fonts/NerdFonts"
          test ! -e "$HOME/.bash-it"
          test ! -e "$HOME/.bashrc"
          test ! -e "$HOME/.oh-my-zsh"
          test ! -e "$HOME/.zprofile"
          test ! -e "$HOME/.zshrc"
          if [[ "$RUNNER_OS" == Linux ]]; then
            grep -q 'DEFERRED' "$RUNNER_TEMP/etch-first-plan.log"
          fi

          ./etch apply --profile developer
          if [[ "$RUNNER_OS" == macOS ]]; then
            command -v brew
            brew --prefix
            grep -q 'homebrew:action\[1\]: SKIP' "$RUNNER_TEMP/etch-first-plan.log"
          fi
          for name in gitconfig gitignore_global gitmessage; do
            test -L "$HOME/.$name"
            test "$(readlink "$HOME/.$name")" = "$GITHUB_WORKSPACE/modules/git/files/$name"
            test "$(readlink "tools/vcs/git")" = "../../modules/git/files"
          done
          test "$(git config --file "$HOME/.gitconfig" --get core.editor)" = vim
          test -L "$HOME/.tmux"
          test "$(readlink "$HOME/.tmux")" = "$GITHUB_WORKSPACE/modules/tmux/files"
          test -x "$HOME/.tmux/plugins/tpm/tpm"
          test -L "$HOME/.tmux.conf"
          test "$(readlink "$HOME/.tmux.conf")" = "$GITHUB_WORKSPACE/modules/tmux/files/tmux.conf"
          grep -q 'set -g mouse on' "$HOME/.tmux.conf"
          tmux -L etch-ci -f "$HOME/.tmux.conf" new-session -d -s etch-ci
          tmux -L etch-ci kill-server
          test -L "$HOME/.config/starship.toml"
          test "$(readlink "$HOME/.config/starship.toml")" = "$GITHUB_WORKSPACE/modules/starship/files/starship.toml"
          if [[ "$RUNNER_OS" == Linux ]]; then
            test -x /usr/local/bin/starship
            /usr/local/bin/starship --version
          else
            starship --version
          fi
          ./etch facts starship | tee "$RUNNER_TEMP/etch-starship-facts.log"
          grep -q 'starship.*version: VALUE' "$RUNNER_TEMP/etch-starship-facts.log"
          if [[ "$RUNNER_OS" == Linux ]]; then
            test -f "$HOME/.local/share/fonts/NerdFonts/HackNerdFont-Regular.ttf"
            test -f "$HOME/.local/share/fonts/NerdFonts/FiraCodeNerdFont-Regular.ttf"
          else
            brew list --cask --versions font-hack-nerd-font
            brew list --cask --versions font-fira-code-nerd-font
          fi
          test -f "$HOME/.bash-it/bash_it.sh"
          test -d "$HOME/.bash-it/enabled"
          test -L "$HOME/.bashrc"
          test "$(readlink "$HOME/.bashrc")" = "$GITHUB_WORKSPACE/modules/bash/files/bashrc"
          test "$(readlink shells/bash/bashrc)" = "../../modules/bash/files/bashrc"
          TERM=xterm bash --noprofile -ic 'test "$BASH_IT" = "$HOME/.bash-it"' > "$RUNNER_TEMP/etch-bash-it-startup.log" 2>&1
          if grep -q 'command not found' "$RUNNER_TEMP/etch-bash-it-startup.log"; then
            cat "$RUNNER_TEMP/etch-bash-it-startup.log" >&2
            exit 1
          fi
          test -f "$HOME/.oh-my-zsh/oh-my-zsh.sh"
          test ! -e "$HOME/.zshrc.pre-oh-my-zsh"
          test "$(readlink shells/zsh/oh-my-zsh)" = "../../modules/oh-my-zsh/files"
          for name in zprofile zshrc; do
            test -L "$HOME/.$name"
            test "$(readlink "$HOME/.$name")" = "$GITHUB_WORKSPACE/modules/zsh/files/$name"
            test "$(readlink "shells/zsh/$name")" = "../../modules/zsh/files/$name"
          done
          for name in zsh-autosuggestions zsh-completions zsh-syntax-highlighting; do
            test "$(readlink "$HOME/.oh-my-zsh/custom/plugins/$name")" = "$GITHUB_WORKSPACE/modules/oh-my-zsh/files/custom/plugins/$name"
          done
          for name in powerlevel9k powerlevel10k; do
            test "$(readlink "$HOME/.oh-my-zsh/custom/themes/$name")" = "$GITHUB_WORKSPACE/modules/oh-my-zsh/files/custom/themes/$name"
          done
          test "$(readlink "$HOME/.oh-my-zsh/custom/powerlevel9k.settings.zsh")" = "$GITHUB_WORKSPACE/modules/oh-my-zsh/files/custom/powerlevel9k.settings.zsh"
          TERM=xterm zsh -lic 'test "$ZSH" = "$HOME/.oh-my-zsh" && command -v starship' > "$RUNNER_TEMP/etch-zsh-startup.log" 2>&1 || {
            cat "$RUNNER_TEMP/etch-zsh-startup.log" >&2
            exit 1
          }

          ./etch apply --profile developer | tee "$RUNNER_TEMP/etch-second-apply.log"
          if grep -Eq '^(CHANGED|FAILED|BLOCKED) ' "$RUNNER_TEMP/etch-second-apply.log"; then
            echo 'Second Etch apply changed state or failed.' >&2
            exit 1
          fi
          ./etch doctor --profile developer

      - name: Inspect the tmux legacy branch with a simulated version
        shell: bash
        env:
          HOME: ${{ runner.temp }}/etch-old-tmux-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$RUNNER_TEMP/etch-fake-bin"
          cat > "$RUNNER_TEMP/etch-fake-bin/tmux" <<'EOF'
          #!/bin/sh
          printf 'tmux 2.0\n'
          EOF
          chmod +x "$RUNNER_TEMP/etch-fake-bin/tmux"
          export PATH="$RUNNER_TEMP/etch-fake-bin:$PATH"
          ./etch plan tmux
          ./etch apply tmux
          test "$(readlink "$HOME/.tmux.conf")" = "$GITHUB_WORKSPACE/modules/tmux/files/tmux-legacy.conf"
          grep -q 'mode-mouse on' "$HOME/.tmux.conf"
