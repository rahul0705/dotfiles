name: Etch compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test POSIX bootstrap installer
        run: python .github/tests/test_installers.py
      - name: Initialize Etch and module assets
        run: git submodule update --init --recursive vendor/etch modules
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Etch configures these tools but does not install them on Linux.
          sudo apt-get update -qq
          sudo apt-get install -y tmux vim zsh bash-completion
          # Linux VS Code installation is user-managed; make extension installation observable.
          curl -fsSL https://update.code.visualstudio.com/latest/linux-deb-x64/stable -o "$RUNNER_TEMP/code.deb"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$RUNNER_TEMP/code.deb"
      - name: Apply developer profile
        shell: bash
        env:
          HOME: ${{ runner.temp }}/etch-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export HOMEBREW_CASK_OPTS="--appdir=$RUNNER_TEMP/etch-apps"
            mkdir -p "$RUNNER_TEMP/etch-apps"
          fi
          ./etch validate
          ./etch plan --profile developer --timings
          if [[ "$RUNNER_OS" == macOS ]] && ! command -v brew >/dev/null; then
            ./etch apply --profile developer --allow-sudo --timings
            case "$(uname -m)" in
              arm64) brew_bin=/opt/homebrew/bin/brew ;;
              *) brew_bin=/usr/local/bin/brew ;;
            esac
            eval "$("$brew_bin" shellenv)"
          fi
          ./etch apply --profile developer --timings
          # Inspect the installed shell environment, not just the configuration links.
          TERM=xterm-256color bash -lic 'test -f "$OSH/oh-my-bash.sh" && test "$STARSHIP_SHELL" = bash && command -v etch >/dev/null'
          TERM=xterm-256color zsh -lic 'test -f "$ZSH/oh-my-zsh.sh" && test "$STARSHIP_SHELL" = zsh && command -v etch >/dev/null'
          # Verify user-local launcher invocation outside the checkout.
          (
            cd "$RUNNER_TEMP"
            "$HOME/.local/bin/etch" validate
          )

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Test Windows bootstrap installers
        shell: pwsh
        run: python .github/tests/test_installers.py
      - name: Test PowerShell profile preservation
        shell: pwsh
        run: python .github/tests/test_powershell_profiles.py
      - name: Prepare WinGet for integration testing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
              Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Repository PSGallery -Scope CurrentUser -Force
              Repair-WinGetPackageManager -Latest -Force
          }
          winget source update --name winget --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet source initialization failed' }
      - name: Apply Windows developer profile and inspect launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git submodule update --init vendor/etch
          if ($LASTEXITCODE -ne 0) { throw 'Etch initialization failed' }
          # Exercise the batch/PowerShell launcher before the upstream validation gate.
          $probe = Join-Path $env:RUNNER_TEMP 'etch launcher with spaces'
          New-Item -ItemType Directory -Force $probe | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $probe 'etch.cmd') -Target (Join-Path $PWD 'etch.cmd') | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $probe 'etch.ps1') -Target (Join-Path $PWD 'etch.ps1') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $probe 'modules/probe') | Out-Null
          Set-Content -LiteralPath (Join-Path $probe 'modules/probe/module.conf') -Value "{'schema_version': 1, 'name': 'probe', 'actions': []}"
          Push-Location $env:RUNNER_TEMP
          try {
              & (Join-Path $probe 'etch.cmd') --version
              if ($LASTEXITCODE -ne 0) { throw 'Batch launcher failed' }
              & (Join-Path $probe 'etch.cmd') plan --repo $probe
              if ($LASTEXITCODE -ne 0) { throw 'Quoted repository argument was not forwarded' }
          } finally {
              Pop-Location
          }
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'etch-home'
          $env:HOME = $env:USERPROFILE
          $env:CODEX_HOME = Join-Path $env:USERPROFILE '.codex'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          python -S vendor/etch/etch validate
          if ($LASTEXITCODE -ne 0) { throw 'Validation failed' }
          python -S vendor/etch/etch apply --profile developer --allow-sudo
          if ($LASTEXITCODE -ne 0) { throw 'Windows developer apply failed' }
          foreach ($unixFile in @('.vim', '.vimrc', '.tmux', '.tmux.conf', '.bashrc', '.bash_profile', '.zshrc', '.oh-my-bash', '.oh-my-zsh', '.config/shell/fzf.sh')) {
              if (Test-Path (Join-Path $env:USERPROFILE $unixFile)) {
                  throw "Unix-only file deployed: $unixFile"
              }
          }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.config/starship.toml'))) {
              throw 'Shared Starship configuration missing'
          }
          # MSI installation updates persistent PATH, not this existing process.
          $env:PATH = "$env:PATH;$([Environment]::GetEnvironmentVariable('Path', 'Machine'));$([Environment]::GetEnvironmentVariable('Path', 'User'))"
          foreach ($hostName in @('powershell.exe', 'pwsh.exe')) {
              & $hostName -NoProfile -NonInteractive -Command '. "$env:USERPROFILE/.config/powershell/profile.ps1"; if ($env:STARSHIP_SHELL -ne "powershell") { throw "Starship initialization failed" }'
              if ($LASTEXITCODE -ne 0) { throw "Starship failed in $hostName" }
          }
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $bin) { throw 'Launcher directory missing from user PATH' }
          # Simulate a new terminal without replacing the runner's process PATH.
          $env:PATH = "$bin;$env:PATH"
          Push-Location $env:RUNNER_TEMP
          try {
              etch.cmd validate
              if ($LASTEXITCODE -ne 0) { throw 'Exposed launcher failed outside checkout' }
              etch.cmd apply --profile developer --allow-sudo
              if ($LASTEXITCODE -ne 0) { throw 'Repeat Windows apply failed' }
          } finally {
              Pop-Location
          }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -cne $userPath) {
              throw 'Repeat apply changed user PATH'
          }
